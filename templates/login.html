{% extends "base.html" %}

{% block title %}Login | National Organ Registry{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="glass-card p-5 shadow-lg" style="max-width: 450px; width: 100%; border-top: 4px solid var(--accent-blue);">
        <div class="text-center mb-4">
            <div class="role-icon mb-3">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="fw-bold text-dark">Secure Access</h2>
            <p class="text-muted">Organ Donation Tracking System</p>
        </div>

        <form method="POST" action="/login">
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold text-uppercase">Access Level</label>
                <select name="role" class="form-select p-3 shadow-none overflow-hidden" style="border-radius: 12px;">
                    <option value="admin">Government Administrator</option>
                    <option value="organization">Medical Organization</option>
                    <option value="doctor">Doctor</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label text-muted small fw-bold text-uppercase">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-secondary-subtle text-muted"><i class="fa-solid fa-user"></i></span>
                    <input name="username" class="form-control p-3 shadow-none" placeholder="Enter Username" required style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-secondary-subtle text-muted"><i class="fa-solid fa-key"></i></span>
                    <input name="password" type="password" class="form-control p-3 shadow-none" placeholder="••••••••" required style="border-radius: 0 12px 12px 0;">
                </div>
            </div>

            <button class="btn btn-gov w-100 p-3 shadow-sm mb-3">
               Sign in <i class="fa-solid fa-right-to-bracket ms-2"></i>
            </button>
            
            <div class="text-center">
                <small class="text-muted">Authorized Personnel Only. </small>
            </div>
        </form>
    </div>
</div>

<style>
    /* Specific overrides for login page to ensure perfect centering without header */
    #main-wrapper { 
        background: radial-gradient(circle at top right, #f1f5f9, #e2e8f0); 
    }
    .form-control, .form-select {
        background-color: #ffffff !important;
        border-color: #cbd5e1 !important;
        color: var(--text-main) !important;
    }
    .form-control:focus, .form-select:focus {
        border-color: var(--accent-blue) !important;
        background-color: #ffffff !important;
        color: var(--text-main) !important;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1) !important;
    }
    .input-group-text {
        border-color: #cbd5e1 !important;
    }
</style>
{% endblock %}
